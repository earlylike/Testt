<!DOCTYPE html><html>
<head>
    <title>Firebase Push Notification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head><body><h2>Firebase Push Notification Demo</h2>

<button onclick="enableNotifications()">
    Enable Notifications
</button>

<p id="status">Notifications not enabled.</p>

<script type="module">

    import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getMessaging,
        getToken,
        onMessage
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBQUJ3lm2aYl5bC2j-n74Rd5hlpCXChmX8",
        authDomain: "testcatering-82592.firebaseapp.com",
        projectId: "testcatering-82592",
        storageBucket: "testcatering-82592.firebasestorage.app",
        messagingSenderId: "948180327087",
        appId: "1:948180327087:web:7b7fb730c3a03ddea0d25a",
        measurementId: "G-WMRRX22P17"
    };

    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    async function enableNotifications() {

        try {

            const permission =
                await Notification.requestPermission();

            if (permission !== "granted") {
                document.getElementById("status").innerText =
                    "Notification permission denied.";
                return;
            }

            const registration =
                await navigator.serviceWorker.register(
                    "./firebase-messaging-sw.js"
                );

            const token = await getToken(messaging, {
                vapidKey: "BMj18bowZtpSyL5dinUuGxVCrUdu3A7X_GUgBVsCFQ5Y63-Fg1-DjkxYShB4SbrYNCb9nbz3XJp2K1IG_qvP4k0",
                serviceWorkerRegistration: registration
            });

            console.log("FCM TOKEN:", token);

            document.body.innerHTML +=
    `<textarea style="width:95%;height:150px">${token}</textarea>`;

            document.getElementById("status").innerText =
                "Notifications enabled!";

            alert("FCM Token generated. Check console.");

        } catch (error) {

            console.error(error);

            document.getElementById("status").innerText =
                "Error: " + error.message;
        }
    }

    window.enableNotifications = enableNotifications;

    onMessage(messaging, (payload) => {

        alert(
            payload.notification?.title + "\n" +
            payload.notification?.body
        );

    });

</script>

</body>
</html>
